<div class="container py-4">
  <h1 class="h3 mb-4">LifeOS</h1>

  <div class="card mb-4">
    <div class="card-body">
      <h2 class="h6 mb-2">API status</h2>
      <p class="mb-0 text-secondary">{{ apiMessage() }}</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h6 mb-2">Tag picker demo</h2>
      <p class="text-secondary small">
        Placeholder demo — tag-picker isn't wired to a real entity yet since Goals/Tasks don't exist until later sessions.
      </p>
      <app-tag-picker
        [selectedTagIds]="demoSelectedTagIds()"
        (selectedTagIdsChange)="demoSelectedTagIds.set($event)"
      />
    </div>
  </div>
</div>
