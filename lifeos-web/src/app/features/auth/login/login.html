<app-auth-layout>
  <h2 class="h4 mb-4">Log in</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input
        id="username"
        type="text"
        class="form-control"
        [class.is-invalid]="fieldError('username')"
        formControlName="username"
        placeholder="Enter your username"
        autocomplete="username"
      />
      @if (fieldError('username'); as error) {
        <div class="invalid-feedback d-block">{{ error }}</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input
        id="password"
        type="password"
        class="form-control"
        [class.is-invalid]="fieldError('password')"
        formControlName="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      />
      @if (fieldError('password'); as error) {
        <div class="invalid-feedback d-block">{{ error }}</div>
      }
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="submitting()">
      {{ submitting() ? 'Logging in...' : 'Log in' }}
    </button>
    <div class="text-end mt-2">
      <a routerLink="/reset-password" class="small">Forgot your password?</a>
    </div>
  </form>

  <p class="text-center mt-4 mb-0 text-secondary">
    No account yet? <a routerLink="/register">Register</a>
  </p>
</app-auth-layout>
