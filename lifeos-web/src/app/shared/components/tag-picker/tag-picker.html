<ng-select
  class="lifeos-tag-picker"
  [items]="allTags()"
  bindLabel="name"
  bindValue="id"
  [multiple]="true"
  [hideSelected]="true"
  [closeOnSelect]="false"
  [addTag]="createTag"
  addTagText="Create tag"
  [labelForId]="inputId()"
  placeholder="Type to find or create a tag"
  [ngModel]="selectedTagIds()"
  (ngModelChange)="changed($event)"
/>
